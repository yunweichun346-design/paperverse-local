<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 408" width="680" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>论文阅读平台本地架构</title>
  <desc>用户电脑内三层架构：AI 前端与浏览器经 MCP Server 和本地 HTTP API 访问落盘的论文与笔记数据，数据不出本机</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="648" height="372" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="40" y="44" font-size="12" fill="#5F5E5A">用户电脑 · 隐私边界：无遥测 · 无账号 · 无远程日志 · 数据不出本机</text>

  <rect x="60" y="60" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="135" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">Claude Desktop</text>

  <rect x="250" y="60" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="310" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">Cursor</text>

  <rect x="410" y="60" width="190" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="505" y="82" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">其他 MCP 客户端</text>

  <path d="M135 104 L180 136" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M310 104 L260 136" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M505 104 L320 136" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="120" y="136" width="240" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="240" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">MCP Server（Node · stdio）</text>

  <rect x="440" y="136" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="525" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">浏览器 · 静态前端</text>

  <path d="M240 180 L280 216" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a2)"/>
  <path d="M525 180 L460 216" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="140" y="216" width="400" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">本地后端 · HTTP API</text>
  <text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">仅监听 127.0.0.1 · 启动生成随机 token · 限制 CORS</text>

  <path d="M200 272 L155 312" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M340 272 L345 312" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M480 272 L530 312" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="60" y="312" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="155" y="334" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">papers/ 目录</text>
  <text x="155" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">PDF + meta.json + text.md</text>

  <rect x="280" y="312" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="345" y="334" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">notes/ 目录</text>
  <text x="345" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Markdown 笔记</text>

  <rect x="440" y="312" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="530" y="334" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">library.db</text>
  <text x="530" y="352" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">SQLite · FTS5 全文索引</text>
</svg>
